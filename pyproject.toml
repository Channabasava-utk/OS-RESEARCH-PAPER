[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ahisf"
version = "0.2.0"
description = "Adaptive Hybrid IPC Selection for Cloud-Native Microservices"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "grpcio>=1.70",
    "protobuf>=5.0",
    "requests>=2.31",
    "uvicorn>=0.30",
    "starlette>=0.40",
    "psutil>=5.9",
    "matplotlib>=3.8",
    "pandas>=2.0",
    "scipy>=1.10",
    "python-docx>=1.0"
]

[tool.setuptools.packages.find]
where = ["src"]
